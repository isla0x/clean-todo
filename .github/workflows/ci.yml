name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 결과 모아둘 폴더
        run: mkdir -p "$RUNNER_TEMP/out"

      - name: Flutter 버전
        run: flutter --version 2>&1 | tee "$RUNNER_TEMP/out/flutter_version.txt"

      - name: 플랫폼 폴더(ios, web) 만들기
        run: |
          flutter create --platforms=ios,web --project-name clean_todo --org com.isla0x "$RUNNER_TEMP/scaffold" > /dev/null
          [ -d ios ] || cp -r "$RUNNER_TEMP/scaffold/ios" ios
          [ -d web ] || cp -r "$RUNNER_TEMP/scaffold/web" web

      - name: 패키지 받기
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/out/pub_get.txt"

      - name: 코드 검사
        run: flutter analyze 2>&1 | tee "$RUNNER_TEMP/out/analyze.txt" || true

      - name: 웹 빌드
        run: flutter build web --release --no-web-resources-cdn 2>&1 | tee "$RUNNER_TEMP/out/build_web.txt" || true

      - name: 결과를 ci-output 브랜치에 올리기
        if: always()
        run: |
          cp pubspec.yaml pubspec.lock "$RUNNER_TEMP/out/" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/out/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/ios" "$RUNNER_TEMP/scaffold/web" "$RUNNER_TEMP/out/scaffold/" 2>/dev/null || true
          [ -d build/web ] && cp -r build/web "$RUNNER_TEMP/out/web" || true
          cd "$RUNNER_TEMP/out"
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI 결과 ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output

  # 아이폰 빌드가 되는지만 확인해요(서명 없이). 맥 시간이 비싸서
  # 커밋 메시지에 [ios] 가 들어 있거나 직접 실행했을 때만 돌아요.
  ios-build:
    if: contains(github.event.head_commit.message, '[ios]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 결과 모아둘 폴더
        run: mkdir -p "$RUNNER_TEMP/out"

      - name: 환경 정보
        run: |
          flutter --version 2>&1 | tee "$RUNNER_TEMP/out/flutter_version.txt"
          xcodebuild -version 2>&1 | tee "$RUNNER_TEMP/out/xcode_version.txt"

      - name: 패키지 받기
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/out/pub_get.txt"

      - name: 아이폰 빌드(서명 없음)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/out/build_ios.txt"

      - name: 위젯이 앱 안에 들어갔는지 확인
        continue-on-error: true
        run: |
          {
            ls -la build/ios/iphoneos/Runner.app/PlugIns
            plutil -p build/ios/iphoneos/Runner.app/PlugIns/HaruWidget.appex/Info.plist
          } 2>&1 | tee "$RUNNER_TEMP/out/plugins.txt"

      - name: 위젯 화면 그림 뽑기(시뮬레이터)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/out/widget_previews"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          W=ios/HaruWidget
          xcrun --sdk iphonesimulator swiftc -sdk "$SDK" -target arm64-apple-ios17.0-simulator \
            -o "$RUNNER_TEMP/harness" \
            $W/HaruModels.swift $W/HaruComponents.swift $W/HaruRoutineViews.swift \
            $W/HaruScheduleViews.swift $W/HaruTodoViews.swift $W/ToggleIntent.swift \
            tools/widget_preview/main.swift > "$RUNNER_TEMP/out/preview_compile.txt" 2>&1 || {
              cat "$RUNNER_TEMP/out/preview_compile.txt"; exit 1; }
          DEV=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "시뮬레이터: $DEV" | tee "$RUNNER_TEMP/out/preview_run.txt"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b > /dev/null 2>&1 || true
          xcrun simctl spawn "$DEV" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/out/widget_previews" 2>&1 | tee -a "$RUNNER_TEMP/out/preview_run.txt"

      - name: 결과를 ci-ios-output 브랜치에 올리기
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b ci-ios-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iOS 빌드 결과 ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-ios-output
