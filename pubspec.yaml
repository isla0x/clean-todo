name: clean_todo
description: 투두, 루틴, 일정을 한 줄로 적는 iOS 스타일 할 일 앱
publish_to: 'none'
version: 0.1.0+12

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # 영문·숫자 글꼴을 앱에 넣어서, 인터넷 없이도 처음부터 똑같이 보여요.
    - assets/google_fonts/
  fonts:
    # 한글은 Pretendard (코드의 _font()가 영문·숫자는 Plus Jakarta Sans, 한글은 이 폰트로 보여줘요)
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
